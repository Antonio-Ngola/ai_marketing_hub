version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai-marketing-hub-db
    environment:
      POSTGRES_DB: ai_marketing_hub
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ai-marketing-hub-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/ai_marketing_hub
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    image: node:18-alpine
    container_name: ai-marketing-hub-frontend
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
